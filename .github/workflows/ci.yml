name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test suite
        run: npm test

      - name: Validate example specifications
        run: |
          node bin/code-chords.mjs validate examples/layered-architecture.json
          node bin/code-chords.mjs validate examples/oop-inheritance-trace.json
          node bin/code-chords.mjs validate examples/scanned-java-trace.json
